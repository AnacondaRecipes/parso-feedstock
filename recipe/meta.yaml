{% set name = "parso" %}
{% set version = "0.8.7" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: eaaac4c9fdd5e9e8852dc778d2d7405897ec510f2a298071453e5e3a07914bb1

build:
  number: 0
  skip: true # [py<36]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python
    - setuptools
    - wheel
  run:
    - python

test:
  source_files:
    - test
  imports:
    - parso
    - parso.pgen2
    - parso.python
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - pytest -v --fixtures test

about:
  home: https://github.com/davidhalter/parso
  license: MIT
  license: MIT AND PSF
  license_family: OTHER
  license_file: LICENSE.txt
  summary: A Python Parser
  description: |
    Parso is a Python parser that supports error recovery and round-trip parsing for different Python versions (in multiple Python versions).
    Parso is also able to list multiple syntax errors in your python file.
  doc_url: https://parso.readthedocs.io/en/latest/
  dev_url: https://github.com/davidhalter/parso

extra:
  recipe-maintainers:
    - iron0012
    - synapticarbors
